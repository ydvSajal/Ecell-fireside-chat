services:
  - type: web
    name: corporate-innovation-action-lab
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_USERNAME
        value: sajal
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
